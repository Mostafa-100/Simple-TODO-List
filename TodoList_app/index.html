<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="todo-list">
        <h2>To-Do List<i class="fa-solid fa-note-sticky"></i></h2>
        <div class="create-area">
            <input id="task-input" type="text" placeholder="Add your task">
            <button id="add-button">Add</button>
        </div>
        <div class="task">
            <input type="checkbox" id="task-output">
            <label></label>
            <button id="del-button"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/9e56a67cbb.js" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>

</html>
